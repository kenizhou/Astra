[package]
name = "astra-account"
description = "Load an account's connection config and shape the IMAP connections it drives."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# The protocol-neutral detection result (`Detected`) the recommendation layer routes onto
# a concrete setup form.
astra-autodetect = { path = "../astra-autodetect" }
# The OAuth client the graph token source refreshes through: the product core's own
# token-exchange crate, shared by every provider family.
astra-oauth = { path = "../astra-oauth" }
engine-api.workspace = true
# The dav dial logs a leg that failed while the other stands: the account's
# own errors carry what a caller needs, but a half-up diary is worth a line
# at the source.
log.workspace = true
# The engine's sync cursors and raw MIME type appear in the `Provider` trait's own
# method signatures (`SyncState`, `SyncUpdate`, `RawMime`) and are re-exported by
# neither `engine-api` nor `engine-provider`, so implementing the trait names them
# here. Everything else engine-side comes through `engine-api` / `engine-provider`.
engine-core.workspace = true
# The provider trait and its plumbing (ProviderError, ConnectionInfo, HandOver,
# ScopeSync) that the reconnecting IMAP wrapper implements.
engine-provider.workspace = true
# The host-selected TLS policy every connection of an account runs under; the acceptor
# construction and certificate exception pinning types build against it.
engine-tls.workspace = true
# The IMAP adapter this crate builds an engine `ImapConfig` for; the credential source
# and credentials types are the engine's.
provider-imap.workspace = true
# The CalDAV and CardDAV adapters the optional dav section of a stored account
# dials: the account layer is the host's one dial path, so both legs connect
# here (calendar reads beside the mail providers, contacts as the installed
# leg) rather than each host dialing its own.
provider-caldav.workspace = true
# The Graph adapters the optional graph section of a stored Microsoft account
# dials over the token source (GraphClient, GraphProvider,
# GraphCalendarProvider, MailboxPrincipal): an extension of SP1's design
# decision 4 list, recorded here the way SP2l's engine-tls one was.
provider-graph.workspace = true
# The Google adapters the optional google section of a stored Google account
# dials over the same token source (GoogleClient, GmailProvider,
# GoogleCalendarProvider, CalendarWindow): under the same decision-4 clause
# as the graph one above.
provider-google.workspace = true
# The JMAP adapter the optional jmap section of a stored JMAP account dials
# (JmapConfig, JmapProvider, Credentials): under the same decision-4 clause
# as the graph and google ones above.
provider-jmap.workspace = true
# Implementing the engine's async `Provider` trait for the reconnecting IMAP wrapper.
async-trait.workspace = true
# Builds the reconnecting wrapper's retried provider streams.
async-stream.workspace = true
# Drives the provider streams the wrapper retries (`StreamExt` over email chunks).
futures.workspace = true
serde.workspace = true
# The `/me` address lookup decodes the Graph reply's JSON body (the `mail`
# and `userPrincipalName` properties).
serde_json.workspace = true
# The async runtime the IMAP connections dial and deduplicate over (the TCP stream,
# the dial mutex, and the listener the scripted test server binds).
tokio = { workspace = true, features = ["net", "sync"] }
# Names the stream an IMAP account's connections run over (`ImapConnections`); the
# engine is generic over it and exports no alias.
tokio-rustls.workspace = true
# The stored account config's TOML form (`build_config_toml` / `load_str` / `to_toml`).
toml.workspace = true
thiserror.workspace = true
# The token source's expiry skew, cooldowns, and absolute expiry arithmetic.
time.workspace = true

[dev-dependencies]
# The self-signed certificate the scripted in-process TLS IMAP server presents.
rcgen.workspace = true
# Server side of that scripted TLS server.
rustls.workspace = true
# The test runtime (`#[tokio::test]`) and the line reader the scripted server answers.
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread"] }
