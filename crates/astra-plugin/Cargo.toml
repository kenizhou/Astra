[package]
name = "astra-plugin"
description = "The plugin host's contracts: manifest parsing, lifecycle states, hook API v1 types, and the fail-closed permission table."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# The hook request/response contracts and the manifest's permission and hook
# declarations cross the plugin boundary as serde types.
serde.workspace = true
# The manifest's on-disk form.
toml.workspace = true
# The envelope family's call arguments and event payloads are open JSON.
serde_json.workspace = true
# The bundle's signature and digest (the workspace's ring line).
ring.workspace = true
# The bundle's archive: plain tar.
tar.workspace = true
# The worker host: process spawn, line IO, timeouts, and the channels its
# supervision runs on.
tokio = { workspace = true, features = ["process", "io-util", "sync", "time", "rt"] }

[dev-dependencies]
# Asserting the exact JSON wire shape of every hook contract in the tests.
serde_json.workspace = true
# The worker host's tests run scripted in-memory workers on a real runtime.
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
