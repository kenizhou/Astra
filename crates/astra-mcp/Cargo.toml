[package]
name = "astra-mcp"
description = "The Model Context Protocol surface for Astra Mail: the tool schemas and the untrusted-body fence, the contracts the server and its relay build on."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
