[package]
name = "astra-cli"
description = "The agent-first command line: read and draft verbs over the engine store, every invocation audited."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# Every mail read and write goes through the engine facade; the provider and
# core crates appear beside it only because the offline provider implements
# the engine's `Provider` trait, whose own signatures name `EmailStream`,
# `SyncState`, `RawMime`, and `ProviderError` (the same seam astra-account
# and the app's test fakes already hold).
engine-api.workspace = true
engine-core.workspace = true
engine-provider.workspace = true
# The audit ledger (`AiStore`, `AuditRow`, `CorrelationId`).
astra-ai = { path = "../crates/astra-ai" }
# The key verbs' store: the public key rows, the collected staging area,
# and the trust decisions in crypto.sqlite beside the engine store.
astra-crypto-store = { path = "../crates/astra-crypto-store" }
# The envelope's serialisation.
serde.workspace = true
serde_json.workspace = true
# Awaits the engine's async reads; no timer, no IO of its own.
tokio = { workspace = true, features = ["rt"] }
# Implementing the engine's async `Provider` trait for the offline provider.
async-trait.workspace = true
# The offline provider's one erroring email stream.
futures.workspace = true
# The default data dir beside the product store, when ASTRA_DATA_DIR is unset.
dirs.workspace = true

[dev-dependencies]
# The audit-row assertions open the ledger's sqlite file directly: the store
# itself only appends.
rusqlite.workspace = true
# The key verb tests seed real keys into a file store; the fixed test master
# key keeps the suite off the OS keyring (the astra-app pattern).
astra-crypto-store = { path = "../crates/astra-crypto-store", features = ["testing"] }
# The key verb tests build real OpenPGP cert fixtures (public certs and a
# secret-bearing TSK) through Sequoia's CertBuilder and read fingerprints
# and public blobs through the openpgp crate's keymap.
astra-crypto-openpgp = { path = "../crates/astra-crypto-openpgp" }
sequoia-openpgp = { version = "2", default-features = false, features = ["crypto-rust", "allow-experimental-crypto", "allow-variable-time-crypto"] }
# The key verb tests hex-encode a seeded S/MIME row's fixture bytes.
hex = "0.4"
