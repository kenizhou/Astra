# Cargo settings that must hold for every build of this workspace. Tracked on
# purpose. The engine is vendored in-tree at vendor/engine/ (path deps in the
# workspace Cargo.toml), so no override of any kind is needed for local engine
# development: edit vendor/engine/ in place, land the edit as an ordinary
# commit, and let the vendor-sync flow in docs/upstream-sync.md keep the tree's
# provenance (the `git diff vendor-sync main -- vendor/engine` listing of every
# in-tree modification).

# One build directory for every checkout of this repository, so worktrees
# share the compile work instead of each growing a multi-GB `target/`.
# Intermediates only: binaries and test executables still land in each
# checkout's own `target/`. Fixed name on purpose: `{workspace-path-hash}`
# would give every worktree its own directory and defeat the sharing.
# `{cargo-cache-home}` is CARGO_HOME, so no absolute path is committed. Cargo
# locks the directory for the length of a build, so a second checkout waits;
# `CARGO_BUILD_BUILD_DIR` opts one out. NOTE: freshness is keyed on
# workspace-relative paths, so a worktree whose vendor/ diverges from this
# checkout's (the vendor-sync worktree, for one) MUST set its own
# CARGO_BUILD_BUILD_DIR or it can be handed stale engine artifacts.
[build]
build-dir = "{cargo-cache-home}/build/astra-mail"
