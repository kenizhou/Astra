name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci-ok:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      # astra-desktop is a workspace member, so the workspace clippy and test
      # steps below run its build script and tauri-build's externalBin
      # existence check. The staged copy is gitignored, so a fresh checkout
      # has none: stage a placeholder before any compiling step. This job
      # never bundles, so the placeholder is all it needs.
      - name: Stage the CLI placeholder for the externalBin check
        run: node client/desktop/scripts/stage-cli.mjs --placeholder-ok
      # The desktop agent tests spawn the stub sidecar under a real Node,
      # version gated at 22 or newer; the runner's default node is older,
      # so the suite runs against a pinned one.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Gate
        run: cargo run -p xtask -- gate
  # The desktop host on its shipping platform: clippy and a build of the Tauri
  # crate (windows-latest needs no extra system libraries for it), then the web
  # client the shell loads. The esbuild postinstall approval lives in
  # client/web/package.json under allowScripts (the record
  # `npm install-scripts approve esbuild` writes), so `npm ci` runs it without an
  # interactive step; npm 11 only warns when the record is missing, and the
  # committed one keeps the job clean and a future blocking npm green.
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build the CLI
        run: cargo build --release --bin astra-cli
      - name: Stage the CLI for the Tauri externalBin
        run: node client/desktop/scripts/stage-cli.mjs
      - name: Clippy (desktop host)
        run: cargo clippy -p astra-desktop --all-targets -- -D warnings
      - name: Build (desktop host)
        run: cargo build -p astra-desktop
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install web dependencies
        working-directory: client/web
        run: npm ci
      - name: Build web client
        working-directory: client/web
        run: npm run build
      - name: Test web client
        working-directory: client/web
        run: npm run test:run
