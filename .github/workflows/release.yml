name: Release bundles
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Attach the installers to this standing release tag; empty builds workflow artifacts only"
        required: false
        default: ""

# The bundle workflow: a v* tag builds the installers on all three desktop
# platforms and attaches them to the named release. The explicit chain (web
# dependencies and build, the sidecar bundle, the release CLI, the real
# staging) mirrors ci.yml's discipline: never depend on the tauri config's
# beforeBuildCommand, which serves local `cargo tauri build` and runs the
# same chain redundantly here. The installers are UNSIGNED: no signing
# configuration rides in this workflow, and the release body says so.
permissions:
  # The token writes release assets; the default read-only token answers
  # "Resource not accessible by integration" at the upload.
  contents: write
jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis,msi
          - os: ubuntu-latest
            bundles: deb,appimage
          - os: macos-latest
            bundles: dmg,app
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Tauri system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            client/web/package-lock.json
            sidecar/package-lock.json
      - name: Web dependencies
        run: npm --prefix client/web ci
      - name: Build the web client
        run: npm --prefix client/web run build
      - name: Build the sidecar bundle
        run: npm --prefix sidecar ci && npm --prefix sidecar run build
      - name: Build the CLI (release)
        run: cargo build --release --bin astra-cli
      - name: Stage the real CLI for the externalBin
        run: node client/desktop/scripts/stage-cli.mjs
      - name: Bundle the installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: client/desktop
          tagName: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          args: --bundles ${{ matrix.bundles }}
      - name: Keep the installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app
          if-no-files-found: error
