[package]
name = "astra-desktop"
description = "The Astra Mail desktop host: the Tauri shell, the frameless main window, and the app's async runtime."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[build-dependencies]
# Embeds tauri.conf.json, the capability files, and the window icons into the
# binary; the build fails when the config or the icons it names go missing.
tauri-build = { version = "2.5", features = [] }

[dependencies]
# The desktop shell this crate is: the builder, the window, and the event loop.
# No tray, devtools, or asset protocol in SP1; the feature set stays empty
# until a task needs one.
tauri = { version = "2.10", features = [] }
# The single-instance guard: must be registered first, before any plugin whose
# initialisation a second launch must not repeat.
tauri-plugin-single-instance = "2"
# The mailto deep link (a second launch's argv arrives through the guard
# above; the cold-start path arrives through this plugin).
tauri-plugin-deep-link = "2"
# External link and folder opening (the shell side of every "open in browser"
# affordance; the webview itself never navigates away).
tauri-plugin-opener = "2"
# File pickers and message boxes behind the composer and settings surfaces.
tauri-plugin-dialog = "2"
# OS notifications for new mail and sync outcomes.
tauri-plugin-notification = "2"
# The app core the host boots and the command surface drives: dispatch, the
# surfaced snapshots, and the boot sequence the host hands its pieces to.
astra-app = { path = "../../crates/astra-app" }
# The account layer the host dials through: the stored config's TOML form, the
# IMAP connections, and the setup builder behind the connection test.
astra-account = { path = "../../crates/astra-account" }
# The immutable snapshots the pull commands hand the webview.
astra-viewmodel = { path = "../../crates/astra-viewmodel" }
# The AI foundation the background LLM client rides: the tier registry, the
# correlation id, and the ledger store its per-attempt rows land in.
astra-ai = { path = "../../crates/astra-ai" }
# The plugin platform's contracts and worker host: the registry's manifests,
# permission table, and out-of-process workers.
astra-plugin = { path = "../../crates/astra-plugin" }
# The MCP server the advanced-settings listener hosts: the server with its
# gate and tool-call ledger, and the endpoint and listener derived from
# the app's data directory.
astra-mcp = { path = "../../crates/astra-mcp" }
# The engine facade: the `Provider` trait the host's boxed provider type names.
engine-api.workspace = true
# The OS secure store the account credentials live in (Credential Manager,
# keychain, secret service), behind the credential-store port.
keyring.workspace = true
# The `AppPort` seam over the app core, mirroring the account layer's connector.
async-trait.workspace = true
# The command payloads and the surface-change event cross the IPC as data.
serde.workspace = true
# The Tauri context macro's generated code names serde_json directly, and every
# command's intent payload arrives as its JSON.
serde_json.workspace = true
# Error enums for the command and credential-store contracts.
thiserror.workspace = true
# Diagnostic lines for the boot and dial paths; the host installs the logger.
log.workspace = true
# The app's async runtime: every engine call the host drives runs on it, and
# blocking host calls are polled on a thread of our own (src/runtime.rs). The
# time feature drives the five second bound around one detection run; the
# process, io-util, and sync features drive the agent sidecar's stdio
# connection and the relay's state channel.
tokio = { workspace = true, features = ["rt-multi-thread", "time", "process", "io-util", "sync"] }
# Account autodetection, whose DNS seam the host resolves for (src/detection.rs).
astra-autodetect = { path = "../../crates/astra-autodetect" }
# The MX and SRV lookups behind that seam, over the system's configured DNS.
hickory-resolver.workspace = true
# The background LLM client's transport. The host builds the client (the
# engine's TLS policy, as autodetection does); the AI module only sends over
# it, so no TLS feature is needed here.
reqwest.workspace = true
# The TLS policy the host builds that client over at boot: the same
# engine-tls build autodetection's fetcher and the client tests use, now on
# the runtime path (the llm store and client are assembled in the boot).
engine-tls.workspace = true
# The OAuth client the sign-in session drives: begin mints the authorization
# URL and the PKCE/state pair, complete parses the deep-link callback and
# exchanges the code (src/oauth).
astra-oauth = { path = "../../crates/astra-oauth" }
# The deep-link URLs the OAuth capture filters by scheme, as the plugin's
# event hands them over.
url.workspace = true
# The instants the OAuth completions stamp their minted tokens with, and
# the civil UTC instants the live documents suite reads back in tests.
time.workspace = true

[dev-dependencies]
# The composer document the drafts intents carry; the command-surface fakes
# render the saved document to the plain text a stored draft resumes as.
astra-composer = { path = "../../crates/astra-composer" }
# The echo plugin's loop, driven in-process over duplex streams by the gate
# tests (the worker host's custom spawn path).
astra-plugin-echo = { path = "../../plugins/echo" }
# The provider-side plumbing the boot dial tests name: ConnectionInfo for
# the stand-in providers' connection answers, which engine-api re-exports
# the traits of but not the type itself.
engine-provider.workspace = true
# Reading the LLM ledger rows back in the client tests, through the test's
# own connection into the file-backed store the client records into.
rusqlite = { workspace = true, features = ["fallible_uint"] }
# Building the tests' HTTP client over the engine's TLS policy, the same way
# autodetection builds its fetcher; the plain-HTTP fixture never exercises
# the TLS path, but the client build needs the installed provider.
engine-tls.workspace = true
