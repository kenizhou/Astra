[workspace]
resolver = "2"
members = ["crates/*", "xtask", "cli", "client/desktop", "plugins/*"]
# The vendored engine tree (vendor/engine) is its own nested workspace and
# must never be auto-enlisted as a member: without this line Cargo tries to
# make every vendored crate a member and the two workspace roots collide.
exclude = ["vendor"]
# Bare `cargo build`/`test`/`run` stay on the engine-side crates; the desktop
# host builds explicitly (`cargo build -p astra-desktop`) because its Tauri
# dependency tree is heavy and needs the platform webview libraries.
# `--workspace` commands still compile it, which is why CI installs the Tauri
# system dependencies (Ruling R8). The CLI is engine-side only (no Tauri
# tree), so bare commands build it too; every documented run of a bin names
# it with `-p`, so the second bin adds no ambiguity in practice.
default-members = ["crates/*", "xtask", "cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/kenizhou/Astra"

# Lint discipline mirrored from mail-calendar (AR5); every member inherits it
# via `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "forbid"
# Every rustc warning is a hard error, caught on a local `cargo build`/`test`
# rather than only in CI. `warnings` is the default-warn group (unused,
# dead_code, and the rest) at low priority; the allow-by-default lints below
# are enabled on top. Only this workspace's crates are affected: Cargo caps
# lints on dependencies. Without a pinned toolchain a newer rustc can
# introduce a new default-warn lint that then fails the build; fix or bump
# when that happens.
warnings = { level = "deny", priority = -1 }
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"

# Rustdoc lints also hard-fail (on `cargo doc`), so a broken/private doc link
# or an accidental HTML tag is caught locally instead of in CI.
[workspace.lints.rustdoc]
all = { level = "deny", priority = -1 }

# Clippy's `pedantic` group is a hard error here. `priority = -1` lets the
# per-lint `allow`s below win; they are the ones that fire almost entirely on
# false positives (mirrors the engine's own allows). Everything else in
# `pedantic` is fixed, not silenced.
[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
# Domain proper nouns (JMAP, CalDAV, IMAP, OAuth, PKCE, RFC numbers, and the
# rest) read as unticked code identifiers to `doc_markdown`, but the docs are
# protocol-heavy prose where they are proper nouns.
doc_markdown = "allow"
# Module and type naming intentionally repeats the module name for call-site
# clarity (for example `account::AccountConfig`); this lint fights that
# convention.
module_name_repetitions = "allow"
# `must_use_candidate` flags nearly every pure getter and builder; the
# signal-to-noise is too low to gate the build on.
must_use_candidate = "allow"
# `too_many_lines` (a per-function 100-line threshold) fights the 500-line
# file rule and fires on cohesive-but-long functions; the file-length gate is
# the size discipline instead.
too_many_lines = "allow"
# The only panics in this workspace are internal `lock().expect("... poisoned")`
# calls: an unrecoverable invariant violation, not documented API behaviour a
# caller can act on. (`missing_errors_doc` stays denied: errors ARE part of
# the contract.)
missing_panics_doc = "allow"

[workspace.dependencies]
# The sync engine, consumed only through its `engine-api` facade (AGENTS.md),
# vendored in-tree at vendor/engine/ (the full upstream tree at the revision
# refs/refs-lock.toml records, MPL-2.0). In-tree edits land as ordinary
# commits; upstream changes arrive through the nightly vendor-sync flow in
# docs/upstream-sync.md.
engine-api = { path = "vendor/engine/crates/engine-api" }
engine-core = { path = "vendor/engine/crates/engine-core" }
engine-provider = { path = "vendor/engine/crates/engine-provider" }
# The engine's own RFC 5322 assembler, used by the crypto bypass so a wrapped
# message is byte-identical to a non-crypto send before the gate runs.
engine-rfc5322 = { path = "vendor/engine/crates/engine-rfc5322" }
# The one host-selected TLS policy shared across IMAP/CalDAV/JMAP/Graph.
engine-tls = { path = "vendor/engine/crates/engine-tls", features = ["tls-native-certs"] }
# Concrete provider adapters the account layer connects.
provider-imap = { path = "vendor/engine/crates/provider-imap" }
provider-caldav = { path = "vendor/engine/crates/provider-caldav" }
# The Microsoft Graph mail read/sync plus writes adapter (bearer-token).
provider-graph = { path = "vendor/engine/crates/provider-graph" }
# The Google (Gmail and Google Calendar) native-API adapter (bearer-token),
# the cloud-API counterpart of provider-graph.
provider-google = { path = "vendor/engine/crates/provider-google" }
# The JMAP mail read/sync plus submission plus calendar-read adapter (RFC
# 8620/8621).
provider-jmap = { path = "vendor/engine/crates/provider-jmap" }
# Serialisation for the types that cross the Tauri IPC.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The stored account config's TOML form (build_config_toml / load_str / to_toml).
toml = "1.0"
# The reading pane's HTML sanitiser, configured to mirror mail-calendar's ammonia
# build (allowlisted tags, attributes, and URL schemes).
ammonia = "4"
# Error enums for the crate-level contracts.
thiserror = "2"
# Diagnostic logging facade; the host installs the logger, the crates only emit.
log = "0.4"
# Implementing the engine's async `Provider` trait for the reconnecting IMAP wrapper.
async-trait = "0.1"
# Builds the reconnecting wrapper's retried provider streams.
async-stream = "0.3.6"
# Drives the provider streams the wrapper retries (`StreamExt` over email chunks).
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
# The sync-depth window's whole-months calendar arithmetic.
time = "0.3"
# The async runtime the IMAP connections dial and deduplicate over.
tokio = { version = "1", default-features = false }
# Names the stream an IMAP account's connections run over (`ImapConnections`); the
# engine is generic over it and exports no alias.
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
# The scripted in-process TLS IMAP server the connection tests dial (dev only).
rcgen = "0.14"
# Server side of that scripted TLS server (dev only).
rustls = { version = "0.23.41", default-features = false, features = ["ring", "std", "tls12"] }
# The OS secure store the desktop host keeps account credentials in (host only:
# Windows Credential Manager, the macOS keychain, the freedesktop secret service).
keyring = { version = "3", features = ["apple-native", "sync-secret-service", "windows-native"] }
# The HTTP client of account autodetection. Redirects are disabled and followed by
# hand so each hop's scheme is inspected for the untrusted-source gate.
reqwest = { version = "0.13.4", default-features = false, features = ["json", "form", "rustls-no-provider", "charset", "http2"] }
# URL construction for the autodetect lookup endpoints; the email address never
# appears in one, and the trust decision reads each hop's scheme.
url = "2"
# base64url without padding: the OAuth PKCE verifier, challenge, and CSRF state.
base64 = "0.23"
# The PKCE S256 digest and the system CSPRNG behind the verifier and state
# (astra-oauth); the same ring line the workspace's rustls already links.
ring = "0.17"
# The plugin bundle's archive: plain tar, uncompressed (the payload is already
# a binary), streaming, no zip index to attack.
tar = "0.4"
# The CLI's default data dir beside the product store, when ASTRA_DATA_DIR is
# unset: the platform's per-user data location (the same directory family the
# desktop host resolves through Tauri's app_data_dir).
dirs = "6"
# Streaming pull-parser for the Mozilla autoconfig XML autodetect reads; no custom
# entity expansion, so a hostile document cannot balloon in memory.
quick-xml = "0.42"
# Mozilla's compiled-in Public Suffix List; derives a provider's registrable domain
# from an MX or server hostname for the autodetect MX fallback.
psl = "2"
# The host side of the autodetect DNS seam (MX and SRV records): mail-calendar's
# clients resolve through each platform's native DNS API, which a Tauri Rust host
# cannot reach, and std's getaddrinfo answers no MX or SRV questions; the desktop
# host resolves through this resolver over the system's configured DNS servers.
hickory-resolver = "0.26"
# The AI ledgers' product SQLite store (astra-ai only; the product database's
# arrival). rusqlite, not sqlx: sqlx's sqlite binding pins libsqlite3-sys
# below 0.38 and the engine's rusqlite needs 0.38.x, and Cargo allows only
# one linked sqlite3 per dependency graph. The same version line as the
# engine so one libsqlite3-sys serves both stores.
rusqlite = { version = "0.40", features = ["bundled"] }
# CorrelationId generation: the v4 UUID spelling, as the kylins ledgers use.
uuid = { version = "1", features = ["v4"] }
